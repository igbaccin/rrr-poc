[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rrr-poc"
version = "0.1.0"
description = "A corpus-bounded literature-review pipeline with page-verified evidence and auditable citations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [{ name = "Igor B. Martins" }]
keywords = ["retrieval", "rag", "literature-review", "citations", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Runtime deps. The `ollama` client is required even in RRR_RUNTIME=api mode
# (the api_backend shim patches ollama.chat), but the ollama *server* is not
# needed there. langdetect powers multilingual routing; anthropic/openai are
# optional extras pulled in by the `api` extra below.
dependencies = [
    "pymupdf>=1.28.0",
    "rank_bm25>=0.2.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "rapidfuzz>=3.9.7",
    "ollama>=0.1.0",
    "pybtex>=0.24.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# `pip install rrr-poc[api]` for the Anthropic or OpenAI runtime.
api = ["anthropic>=0.40.0", "openai>=1.40.0"]

[project.scripts]
# One-command CLI: `rrr t2 --metadata metadata.csv --topic "..."`
rrr = "rrr.cli:main"

[project.urls]
Homepage = "https://github.com/igbaccin/rrr-poc"
Repository = "https://github.com/igbaccin/rrr-poc"
Issues = "https://github.com/igbaccin/rrr-poc/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rrr*"]
